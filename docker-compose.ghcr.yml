# docker-compose.ghcr.yml
# Used to run the prebuilt and pushed image from ghcr.io
# Run: docker compose -f docker-compose.ghcr.yml up -d

services:
  kokoro-vietnamese:
    image: ghcr.io/hutukit/kokoro-vietnamese:latest
    ports:
      - "7888:7888"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7888/v1/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
